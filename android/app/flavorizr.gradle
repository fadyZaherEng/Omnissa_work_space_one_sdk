android {
    flavorDimensions += "flavor-type"

    productFlavors {
        development {
            dimension "flavor-type"
            applicationId "com.mofa.ksa.development"
            resValue "string", "app_name", "Mofa"
        }
        production {
            dimension "flavor-type"
            applicationId "com.mofa.ksa"
            resValue "string", "app_name", "Mofa"
        }
    }
}